[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops"
version = "0.1.0"
description = "Production-oriented LLM evaluation and regression gate platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "alembic>=1.13",
  "bcrypt>=4.0",
  "cryptography>=42.0",
  "psycopg>=3.1",
  "psycopg-binary>=3.1",
  "psycopg2-binary>=2.9.9",
  "pg8000>=1.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg>=3.1", "psycopg-binary>=3.1", "psycopg2-binary>=2.9.9", "pg8000>=1.30.0"]

[tool.vercel]
entrypoint = "api/index.py"

[project.scripts]
evalops = "evalops.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
