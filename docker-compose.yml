services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalops -d evalops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://evalops:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/evalops
      CORS_ORIGINS: http://localhost:3000
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
