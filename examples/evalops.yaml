project:
  name: Example Support Assistant
  description: Explicit fixtures demonstrating deterministic release gates.
gate:
  no_critical_failures: true
  min_pass_rate: 1.0
  max_latency_ms: 5000
  max_tokens: 80
test_cases:
  - id: greeting
    name: Greeting response
    input_text: "Say hello to the user."
    expected_output: "Hello! How can I help?"
    actual_output: "Hello! How can I help?"
    latency_ms: 32
    criteria:
      - type: exact_match
      - type: max_tokens
        value: 20
  - id: answer-format
    name: Required JSON field
    input_text: "Return the requested city as JSON."
    expected_output: '{"city":"Paris"}'
    actual_output: '{"city":"Paris"}'
    latency_ms: 48
    criteria:
      - type: required_fields
        fields: [city]
      - type: json_schema
        schema:
          type: object
          required: [city]
          properties:
            city: {type: string}
